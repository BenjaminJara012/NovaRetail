spring.application.name=ms-productos

# Puerto del microservicio
server.port=8081

#Configuracion de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Configuración de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/novaretail_productos
spring.datasource.username=${DB_USERNAME:novaretail}
spring.datasource.password=${DB_PASSWORD:novaretail_dev}
