spring.application.name=ms-carrito

# Puerto del microservicio
server.port=8083

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5434/novaretail_carrito
spring.datasource.username=${DB_USERNAME:novaretail}
spring.datasource.password=${DB_PASSWORD:novaretail_dev}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuracion de desarrollo
spring.devtools.restart.enabled=false

# Direccion del microservicio de productos
services.productos.url=http://localhost:8081

